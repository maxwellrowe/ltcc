<!-- Style: white | blue-100 | green-100 | gradient | dark-blue.
     Padding: 1–5, default 3. Title size: h1–h6, default h5 (visual size).
     Image and icon are optional. Images are decorative (alt=""). Icon takes a name such as fa-house; XSL adds fa-sharp fa-regular.
     Description: WYSIWYG. Each child UL in links is a repeatable element group.
     Link style: primary | secondary | arrow (default). Empty links are omitted. -->
<ouc:component name="component-card">
  <ul>
    <li class="style">white</li>
    <li class="padding">3</li>
    <li class="image"></li>
    <li class="icon">fa-house</li>
    <li class="title-size">h5</li>
    <li class="title">Live and Learn on Campus</li>
    <li class="description"><p>Stay in our on-campus residence hall and live right in the heart of the action from day one.</p></li>
    <li class="links">
      <ul>
        <li class="url">/campus-life/</li>
        <li class="text">Explore Campus Life</li>
        <li class="style">arrow</li>
      </ul>
    </li>
  </ul>
</ouc:component>
