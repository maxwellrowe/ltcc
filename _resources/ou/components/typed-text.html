<!-- Plain text fields; no HTML in phrases. Repeat each entire phrase UL.
     Size: h1–h6 or fs-1–fs-6. Colors: primary, secondary, text-bright-green,
     text-blue-400, text-green-100, text-blue-100, white (text-* aliases accepted).
     Speed: slow / normal / fast. Delays: milliseconds.
     Prefix/suffix optional. Include a leading space in suffix for words, not punctuation. -->
<ouc:component name="component-typed-text">
  <ul>
    <li class="prefix">Your place to</li>
    <li class="suffix">.</li>
    <li class="size">h2</li>
    <li class="prefix-color">primary</li>
    <li class="typed-color">text-bright-green</li>
    <li class="suffix-color">primary</li>
    <li class="loop">true</li>
    <li class="speed">normal</li>
    <li class="start-delay">0</li>
    <li class="phrase-delay">2000</li>
    <li class="show-cursor">true</li>
    <li class="break-after-prefix">true</li>
    <li class="phrases">
      <ul><li class="text">connect</li></ul>
      <ul><li class="text">get outside</li></ul>
    </li>
  </ul>
</ouc:component>
