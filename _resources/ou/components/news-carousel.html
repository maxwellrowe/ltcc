<!-- Items per row: 1–6. Tablet starts at md; desktop at lg. Maximum: 1–50.
     Events: category filters belong in the RSS URL; featured true means featured only.
     Organizer is an optional exact name (case insensitive). Blank means all.
     Feed hosts: www.ltcc.edu, ltcc.edu, api.calendar.moderncampus.net. -->
<ouc:component name="component-news-carousel">
  <ul>
    <li class="feed-url">https://www.ltcc.edu/rss/news.xml</li>
    <li class="items-mobile">1</li>
    <li class="items-tablet">2</li>
    <li class="items-desktop">3</li>
    <li class="max-items">6</li>
  </ul>
</ouc:component>
