<!-- Style: white | blue-100 | green-100 | gradient. Padding: 1–5, default 3.
     Title size: h1–h6, default h5 (visual size; the heading remains an h2).
     Title and URL are required. Description is plain text. Image is optional.
     Images are decorative (alt=""); the whole card is a single focusable link. -->
<ouc:component name="component-card-link">
  <ul>
    <li class="style">white</li>
    <li class="padding">3</li>
    <li class="title-size">h5</li>
    <li class="title">Explore Programs</li>
    <li class="description">Find the path that fits your goals.</li>
    <li class="url">/academics/academic_programs/</li>
    <li class="image"></li>
  </ul>
</ouc:component>
