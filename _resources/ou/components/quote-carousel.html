<!-- Style: blue-100 (default), green-100, white, gradient.
     Repeat the entire child UL inside quotes, not just its LI fields.
     Quote, name and title are plain text. Image is optional and decorative.
     Empty quotes are omitted. One quote renders without slider controls. -->
<ouc:component name="component-quote-carousel">
  <ul>
    <li class="style">blue-100</li>
    <li class="quotes">
      <ul>
        <li class="image"></li>
        <li class="quote">Your story starts here.</li>
        <li class="name">Jane Doe</li>
        <li class="title">Registered Nursing</li>
      </ul>
    </li>
  </ul>
</ouc:component>
